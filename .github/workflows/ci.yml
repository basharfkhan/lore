name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No `embed` extra: nothing under test imports the embedding model, and it would pull PyTorch.
      - run: pip install -e ".[dev,ingest,serve]"
      - run: ruff check .
      - run: ruff format --check .
      # Unpack the tracked corpus so the tests that need real data (label checks, the agent's
      # tools, the LLIS date guard) run here instead of skipping.
      - run: python -m lore.serve.corpus --ensure
      - run: pytest -q
