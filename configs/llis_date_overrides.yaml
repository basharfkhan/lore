# LLIS lessons whose recorded date is impossible: they describe a mishap that had not happened
# yet on that date. Left alone, they leak the answer into the historical eval (a pre-mortem for
# Genesis would retrieve the Genesis mishap lesson). Found by scanning for lessons that name a
# catalogued mishap and are dated before it; tests/test_llis_dates.py repeats that scan.
#
# The replacement is the earliest date the content could have existed: the release of the
# investigation it summarises. That is conservative, which is the safe direction for a cutoff.

