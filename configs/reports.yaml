# Public mishap investigation reports that seed the corpus alongside LLIS.
#
# mishap_date is the date of the failure itself. It is the cutoff for the historical eval:
# when LORE is asked about a system as it stood before a mishap, only material dated before
# this day may be retrieved. report_date is when the findings became public, which is when
# they could first have taught anyone anything.
#
# Every URL is a NASA host (nasa.gov, NTRS, LLIS, LaRC). Mirrors on third-party sites are
# deliberately not used, so provenance is never in question.

reports:
  - id: apollo1_as204
    title: Report of Apollo 204 Review Board
    mission: Apollo 1
    mishap_date: 1967-01-27
    report_date: 1967-04-05
    url: https://ntrs.nasa.gov/api/citations/19820066930/downloads/19820066930.pdf

