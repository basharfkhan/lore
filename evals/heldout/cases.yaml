# Held-out cases mined from obscure LLIS incidents by lore/eval/mine_cases.py.
# Rewritten and contamination-probed with claude-opus-5; only unrecognised cases kept.
# Never tune on these: they exist to test a design fixed on the dev cases.
cases:
- id: llis439
  source_lesson: llis-439
  source_title: Avoid Use of PFPE-based Lubricant on Moving Surfaces of Titanium (or Other Highly Reactive
    Metal) Bearings (1993)
  cutoff: '1993-01-01'
  query: Pre-mortem requested for the attitude-determination sensor on a three-axis-stabilised Earth-observing
    spacecraft in a circular low Earth orbit with a multi-year design life. The unit is an infrared horizon
    sensor assembly using a continuously rotating scan prism driven by a small brushless motor on a preloaded
    angular-contact bearing pair, with thermopile detectors viewing the CO2 band, a rotor position encoder,
    and dedicated drive and signal-processing electronics. Two identical assemblies are flown, cross-strapped
    to the attitude control computer, and the design is common to several other programmes. Qualification
    includes vibration, thermal-vacuum performance over the full operating range, radiation and EMC testing,
    plus an ambient life test on an engineering unit. The units are procured from an outside supplier
    to a heritage build standard under a cost-capped schedule, with limited flight spares. Identify credible
    ways this sensor could degrade or fail on orbit.
  failure_mechanism: Titanium wear debris spalled from the scan motor shaft/bearing reacted with the perfluoropolyalkyether
    (PFPE) lubricant, forming acids that catalysed further lubricant breakdown and polymerisation, seizing
    the rotating prism motor in flight.
  hindsight_queries:
  - PFPE lubricant degradation bearing debris
  - spacecraft bearing lubricant polymerization failure
  - reactive metal bearing material lubricant compatibility
  - scan motor bearing wear debris seizure on orbit
  - lubricant life test thin film boundary lubrication spacecraft mechanism
  difficulty: easy
  blind_guess: The most likely failure is wear-out of the continuously rotating scan prism mechanism —
    specifically progressive loss and degradation of the bearing lubricant in the preloaded angular-contact
    pair (vacuum evaporation and creep out of the raceways, oxidative/tribochemical breakdown and polymerisation
    of the oil, and eventual boundary-lubrication wear debris) — which raises and destabilises the running
    torque until the motor drive can no longer hold constant scan rate, producing encoder/scan-phase jitter
    and horizon-crossing timing errors, then rising motor current and ultimately stall, and because the
    mechanism is identical, continuously duty-cycled, and qualified only by an ambient (non-vacuum) life
    test, it is a common-cause wear-out that is likely to claim both cross-strapped assemblies at similar
    times rather than a random single-unit loss."}
  contamination:
    recognised: false
    confidence: low
    guess: Not a specific identifiable mission — reads as a generic/synthetic FMEA 'pre-mortem' exercise
      for a scanning IR (CO2-band) Earth-horizon sensor of the Barnes/Ithaco/Officine Galileo conical-scan
      class, as flown on many 1980s–2000s LEO remote-sensing satellites (Landsat/SPOT/ERS/RADARSAT-type
      buses). No unique fingerprint in the text ties it to one flight article.
- id: llis497
  source_lesson: llis-497
  source_title: Propulsion Valve Contamination Sources in Vendor Test Facilities (1995)
  cutoff: '1995-01-01'
  query: We are closing out qualification of a high-pressure latch valve used in the helium pressurization
    branch of a dual-mode propulsion system shared by two planetary spacecraft. The valve is a solenoid-actuated,
    magnetically latching design with a polymer-seated poppet, rated to 4000 psi working pressure with
    a 1.5x proof and 2.5x burst margin, and must hold an external and internal leak rate below spec for
    a mission life exceeding seven years. Qualification at the vendor's facility covers structural proof,
    burst on a sacrificial unit, actuation-cycle life at voltage extremes, random vibration and pyro shock,
    and a closing thermal cycle test over the qualification temperature range with helium leak measurement
    by mass spectrometer at each plateau. Flight units are already in fabrication, so the qualification
    article must pass without rework to hold the delivery date. Where could this qualification program
    fail?
  failure_mechanism: Hydrocarbon oil and particulate from the vendor's pressurization compressor (whose
    cold trap was non-functional) migrated into the valve with the test helium and accumulated on the
    hard plastic valve seat, which cannot conform around particles, producing unacceptable leakage.
  hindsight_queries:
  - hydrocarbon contamination from test facility compressor
  - gas purity requirements for valve qualification testing
  - particulate contamination causing valve seat leakage
  - hard polymer seal contamination sensitivity leak
  - ground support equipment cleanliness propulsion components
  difficulty: hard
  blind_guess: The most probable failure is internal seat leakage exceeding spec at the cold plateau of
    the final thermal-cycle test — the polymer poppet seat, already having taken compression set/cold
    flow and embedded particulate scoring from the preceding high-cycle actuation-life and vibration/shock
    runs, loses seating load as differential thermal contraction between the metal poppet/seat carrier
    and the stiffening polymer (below its ductile-to-glassy transition) opens a leak path that the magnetic
    latch's fixed closing force cannot compensate, and because this test sits last in the sequence the
    failure surfaces only after the article's life has been consumed, forcing seat redesign or preload
    change that cannot be requalified without reworking units already in fabrication.
  contamination:
    recognised: false
    confidence: low
    guess: Not confidently identifiable. The framing (a magnetically latching high-pressure helium latch
      valve in a dual-mode NTO/hydrazine system common to a pair of planetary spacecraft, ~7+ year life,
      4000 psi class) resembles several real programs — e.g. twin Mars-bound or twin planetary orbiters
      sharing a bus/propulsion design (Viking 1/2-style, Mars Observer/MGS-heritage dual-mode hardware,
      or a two-spacecraft set like GRAIL/Van Allen-class builds) — but no single mission or anomaly is
      uniquely pinned down by these details.
- id: llis559
  source_lesson: llis-559
  source_title: Redundant Verification of Critical Command Timing (1995)
  cutoff: '1995-01-01'
  query: Pre-mortem requested for an interplanetary science spacecraft now entering an extended phase
    after completing its first major science objective. The vehicle uses a radiation-tolerant, mass-optimised
    flight computer of modest throughput, a hydrazine propulsion set used for pointing and trajectory
    maneuvers, star-tracker and gyro-based attitude determination, and an onboard sequencing engine that
    executes ground-generated command loads. Maneuvers are commanded through an enable/execute sequence
    with onboard logic that bounds the firing interval. Flight software is revised incrementally by uplinked
    loads; sequences and software builds are produced on a single ground development and simulation model
    shared across operations. Ground contact is intermittent, with round-trip light time and station scheduling
    limiting fault response to tens of minutes. The operations team is small and budget-constrained. Identify
    credible ways this extended mission could lose the vehicle or its remaining propellant.
  failure_mechanism: An uplinked software load omitted the patch for a known arithmetic-overflow defect;
    during a thruster-enabled pointing maneuver the overflow triggered a floating-point interrupt that
    corrupted commands and disabled the burn-duration countdown timer, and with no independent watchdog
    the thrusters fired far past shutdown, dumping mission-ending amounts of propellant before ground
    intervention.
  hindsight_queries:
  - arithmetic overflow flight software erroneous commands
  - independent watchdog timer burn duration termination
  - uplinked software load version control missing patch
  - uncommanded thruster firing propellant depletion anomaly
  - testbed verification of in-flight software updates
  difficulty: hard
  blind_guess: 'The most credible loss mode is propellant depletion from an uncommanded/runaway thruster
    firing: a ground-generated sequence or incrementally patched flight software load — validated only
    on the single shared, imperfectly configuration-matched simulation model — leaves the maneuver enable
    latched or is interrupted by a safing/fault-protection reset that reboots the low-throughput processor
    mid-burn, so the burn-duration bounding logic is bypassed or re-triggered and the hydrazine thrusters
    fire continuously (also spinning the vehicle up beyond star-tracker acquisition limits), with round-trip
    light time, station scheduling gaps, and a thin operations staff preventing intervention within the
    tens of minutes needed to save the remaining propellant.'
  contamination:
    recognised: true
    confidence: medium
    guess: Deep Impact / EPOXI (NASA Discovery comet mission, JPL/Ball), described just after the Tempel
      1 encounter as it moves into its extended mission
- id: llis567
  source_lesson: llis-567
  source_title: Provide Software Checks On All Spacecraft Command Constraints (1997)
  cutoff: '1997-01-01'
  query: 'Pre-mortem requested for the on-orbit commissioning of the first unit of a production-line commercial
    geosynchronous communications satellite. After apogee-motor burns place the craft near its final slot,
    a two-week checkout campaign will verify the bus and payload: solar array and reflector deployments,
    battery and power bus margins, transponder and antenna pattern tests, thermal soak, and a series of
    closed-loop attitude control demonstrations in which controllers deliberately perturb the vehicle
    off its Earth-pointing reference and confirm that the rate sensors, Earth/Sun sensors, momentum wheels
    and hydrazine thrusters restore pointing. All tests are commanded from a single ground station via
    stored and real-time command loads, scripted by the operations team and verified against telemetry
    limits. Programme constraints are aggressive: fixed-price commercial delivery, a shared control centre
    supporting several other spacecraft, minimal hardware-in-the-loop simulation, and a compressed schedule
    to hand the satellite to the customer quickly.'
  failure_mechanism: Gyros were left on the fine (0.6 deg/s) sensitivity setting from transfer orbit when
    controllers commanded a 1 deg/s roll test, saturating the attitude control electronics so thrusters
    fired continuously and spun the satellite up, and no software command-constraint check existed to
    block the incompatible command.
  hindsight_queries:
  - sensor saturation attitude control runaway thruster firing
  - command constraint checking flight software prohibited commands
  - instrument gain range setting not reconfigured before test
  - rate gyro scale range switching operational error
  - on-orbit checkout test exceeded sensor measurement range
  difficulty: hard
  blind_guess: The most likely loss is a human-authored command-load error in the deliberately-destabilizing
    attitude demonstrations — e.g., a wrong sign, scale factor, or reference-frame/units mismatch in a
    stored ACS test parameter that was never exercised in hardware-in-the-loop simulation — which turns
    the closed-loop 'restore pointing' test into a positive-feedback thruster firing that drives the vehicle
    off Earth/Sun sensor lock into a tumble; because onboard fault protection and safe-mode transitions
    were deliberately inhibited to let the test run, and the single ground station plus a shared, schedule-pressured
    control room delays recognition and recovery, the vehicle spins up and expends its hydrazine (and
    loses power/thermal margin from an unpointed array) before operators regain control.
  contamination:
    recognised: false
    confidence: low
    guess: Generic/composite description of a first-of-class commercial GEO comsat lost or damaged during
      on-orbit checkout; closest real analogues I can think of are an early-production Ford Aerospace
      FS-1300 (Superbird-A, 1989-90, attitude-control/propellant loss) or the SOHO-style case of a ground-scripted
      attitude-control demonstration that drove the vehicle into an uncontrolled tumble
- id: llis572
  source_lesson: llis-572
  source_title: Damage to Bipropellant Main Engines from Premature Oxidizer Depletion (1997)
  cutoff: '1997-01-01'
  query: 'Pre-mortem request: first flight article of a new commercial geostationary communications satellite
    bus. After separation from the launch vehicle into transfer orbit, the spacecraft executes a sequence
    of apogee burns using a pair of storage-pressure-fed bipropellant main engines (nitrogen tetroxide
    with hydrazine), with helium regulated tank pressurization, latching isolation valves and redundant
    monopropellant thrusters for attitude control and station keeping. Propellant quantities are set during
    pre-launch loading from mission analysis of the planned orbit-raising sequence; burn duration and
    termination are managed by onboard software using inertial sensing, with ground monitoring of feedline
    and chamber pressures throughout. Qualification relies on supplier component acceptance testing plus
    system-level flow, thermal-vacuum and pressurization checks. Program constraints: fixed-price commercial
    build, compressed schedule to first launch, a 15-year on-orbit design life, and limited customer access
    to subcontractor test records. Identify credible failure paths.'
  failure_mechanism: The flight propellant load was computed using a nominal engine mixture ratio rather
    than the higher actual ratio shown in supplier engine flow acceptance tests, so the oxidizer ran out
    about a minute before the end of the final burn, and the time-averaged acceleration-drop threshold
    in the onboard software never tripped because residual monopropellant thrust and intermittent oxidizer
    slugs kept acceleration above the cutoff, letting the engines run damaged in an off-nominal mode until
    ground commanded shutdown.
  hindsight_queries:
  - bipropellant propellant load mixture ratio uncertainty
  - engine acceptance test data flight propellant budget
  - propellant depletion detection accelerometer threshold
  - oxidizer ullage gas saturation engine damage
  - supplier test data not provided to customer propulsion
  difficulty: hard
  blind_guess: The most credible failure is a propellant-path blockage or leak at the oxidizer/fuel interface
    of the pressurization system — specifically, helium regulator internal leakage (or a failed-open regulator/check-valve
    arrangement) allowing NTO and hydrazine vapors to migrate back up the common pressurant lines, react
    and deposit nitrate/nitrite solids that plug a check valve or the regulator seat, so the tanks either
    over-pressurize toward burst or the regulator locks up and the engines run in blowdown at falling
    chamber pressure, causing an undershot or terminated apogee burn that leaves the satellite short of
    geostationary orbit with insufficient remaining propellant for the 15-year life.
  contamination:
    recognised: false
    confidence: low
    guess: No single mission identified with confidence. The write-up reads as a generic/synthesised 'first
      flight of a new GEO comsat bus' pre-mortem rather than a specific, uniquely identifiable spacecraft.
      The closest real-world analogues that match the propulsion-centric failure space are Eutelsat W3B
      (Spacebus 4000C3, Oct 2010, oxidiser leak after separation, declared a total loss before orbit raising),
      Intelsat 29e (Boeing 702MP first EpicNG article, propellant leak/structural breach in 2019, total
      loss), Intelsat 33e (702MP, degraded orbit-raising thruster performance shortening life, later broke
      up), and GSAT-6A (contact lost during the third apogee burn).
- id: llis579
  source_lesson: llis-579
  source_title: Avoid Inadvertent quotHotquot Mates or Demates of Connectors (1996)
  cutoff: '1996-01-01'
  query: Pre-mortem requested for integration and test of the electrical power subsystem of a planetary
    orbiter being assembled in a high-bay cleanroom. The subsystem comprises deployable solar array strings
    feeding a regulated main bus through blocking diodes and series inductors, two rechargeable batteries,
    remote power switches distributing bus power to loads, and a shunt regulator. Ground support equipment
    supplies external power through a facility umbilical during most functional testing. Assembly involves
    repeated build-up and reconfiguration of the flight harness, with multipin circular connectors mated
    and demated by technicians under quality inspection as subsystems are added, removed for rework, and
    reinstalled. The spacecraft will also be moved between electrical test, mass properties, acoustic
    and thermal-vacuum facilities on a schedule with limited slack. Verification is by end-to-end functional
    tests before and after each environmental exposure. Identify credible ways this activity could damage
    flight hardware or cost schedule.
  failure_mechanism: During mating of an electrical power connector with the battery charged, a corner
    pin (a solar array power return isolated by a remote power switch) touched the mating connector's
    grounded backshell because of a slightly cocked, non-scoop-proof entry, creating a current path around
    the switch that momentarily energized the power bus.
  hindsight_queries:
  - hot mate demate powered connector spacecraft
  - scoop-proof connector pin short backshell
  - battery isolation before harness mating integration
  - inadvertent power bus energizing during assembly
  - connector cocking pin damage mismate lessons
  difficulty: easy
  blind_guess: 'The most probable failure is a connector-driven power fault during harness reconfiguration:
    a technician mates or demates a multipin circular power connector with the bus energized (from GSE
    or, more dangerously, from the always-hot battery side that has no upstream fuse or switch), and a
    bent, pushed-back, or mis-aligned contact momentarily bridges a high-current bus pin to an adjacent
    return or signal pin, injecting an unlimited-current arc/transient that welds or carbonizes the contacts
    and blows through the downstream part — typically a remote power switch FET, a load''s input filter,
    or a blocking diode — with the damage latent until a post-environmental functional test reveals it,
    forcing connector and box-level rework that consumes the limited schedule slack.'
  contamination:
    recognised: false
    confidence: none
    guess: No specific mission identified — this reads as a generic integration-and-test pre-mortem for
      a planetary orbiter's EPS, not a description of a known flight event. If it is modelled on real
      incidents, the closest analogues are cleanroom/I&T mishaps such as NOAA-N Prime's 2003 fall during
      a turn-over operation (handling/schedule pressure, procedural non-compliance), the Genesis/other
      programmes' ground-handling and test-configuration errors, and various unpublicised GSE overvoltage,
      battery deep-discharge, and connector-mismate events reported in NASA lessons-learned/GIDEP databases.
- id: llis583
  source_lesson: llis-583
  source_title: Test Contingency Planning Should Consider Facility Power Interruptions (1996)
  cutoff: '1996-01-01'
  query: Pre-mortem requested for the system-level thermal-vacuum test campaign of a three-axis-stabilised
    planetary orbiter built to a fixed interplanetary launch window. The flight vehicle, with propulsion
    module, deployable solar arrays stowed, science payload and flight avionics, will be installed in
    a large thermal-vacuum chamber with cryogenic shrouds and solar simulation. Ground support equipment
    includes a propulsion pressure-control and evacuation cart, chamber pumping and instrumentation racks,
    thermocouple and telemetry data acquisition, and cleanliness monitoring for a contamination-sensitive
    spacecraft. Test objectives are hot and cold balance points, transitions, and functional performance
    of all subsystems across several continuous days of round-the-clock operation with rotating crews.
    Verification is by test procedure with red-line limits and console-monitored abort criteria; schedule
    margin before shipment is minimal. Identify credible ways this test could damage or compromise flight
    hardware.
  failure_mechanism: A facility-wide electrical power interruption stopped the propulsion GSE vacuum pump,
    and an open port on the pump's relief valve let unfiltered room air flow backwards through the cold
    trap into the flight propulsion system, which lost its net positive pressure, creating a contamination
    risk.
  hindsight_queries:
  - vacuum pump backstreaming loss of power flight hardware
  - GSE fail-safe valve on facility power loss
  - maintain positive pressure propulsion system during test
  - test facility power outage contingency plan contamination
  - FMEA ground support equipment loss of utilities
  difficulty: hard
  blind_guess: 'The most likely failure is a latent instrumentation/control error compounded by round-the-clock
    human factors: a control thermocouple that is mis-mapped in the DAQ/heater control configuration or
    debonded from its hardware (so it reads shroud or nearby structure rather than the component), which
    during a cold-soak or transition — typically across a night-shift handover when console attention
    and procedural continuity are weakest — lets the console and red-line monitors display an in-limit
    temperature while the actual flight item (propellant line/valve, catalyst bed, battery, or optics
    bench) drifts tens of degrees below its qualification limit, producing frozen or slushed residual
    propellant and cold-cracked seals/adhesive bond-line or CTE-mismatch damage that is undetectable until
    post-test functional checks and unrecoverable within the launch-window schedule margin because chamber
    warm-up and repressurisation must proceed slowly to avoid contaminating the cold, contamination-sensitive
    surfaces.'
  contamination:
    recognised: false
    confidence: low
    guess: No single mission identified with confidence; it reads as a generic (possibly synthetic/templated)
      pre-mortem for a Mars- or Venus-class three-axis orbiter TVAC campaign in the style of MRO/MAVEN/Mars
      Odyssey/Mars Express-type programmes, rather than a specific named event.
- id: llis591
  source_lesson: llis-591
  source_title: Pyrovalve Blow-by May Interact Violently With Propellant (1993)
  cutoff: '1993-01-01'
  query: Pre-mortem requested for the monopropellant propulsion subsystem of a geostationary communications
    satellite ahead of its qualification review. The system uses a titanium diaphragm tank of hydrazine
    in blowdown mode, feeding two redundant branches of small attitude-control and axial thrusters through
    filters, a pressure transducer, service valves and a set of normally closed pyrotechnic isolation
    valves that keep the fuel sealed from the downstream manifold during ground processing and launch.
    Catalyst beds are conditioned by redundant heaters commanded from the bus computer. After separation
    from the launch vehicle the system is primed on command from ground, followed by an attitude-acquisition
    burn sequence. Verification is by proof and leak testing, vibration and thermal-vacuum testing of
    the flight article, and cold-flow plus hot-fire testing of a development unit. Telemetry bandwidth
    during the early transfer orbit is limited. Schedule is fixed by the launch manifest. Identify credible
    loss-of-mission failure modes.
  failure_mechanism: Priming of the hydrazine line produced a pressure surge that adiabatically compressed
    and partially decomposed fuel trapped against the gas pad downstream of the parallel isolation pyrovalves,
    and hot-gas blow-by from the second pyrovalve firing then detonated the decomposed propellant, rupturing
    the feed lines.
  hindsight_queries:
  - pyrovalve hot gas blow-by propellant ignition
  - hydrazine adiabatic compression detonation priming
  - propellant line water hammer surge decomposition
  - redundant isolation valve firing sequence feed system rupture
  - pad gas downstream of isolation valve propulsion hazard
  difficulty: hard
  blind_guess: 'The most credible loss-of-mission mode is a cold-bed hard start: one catalyst-bed heater
    string (or its thermostat/relay/thermistor path) fails or is mis-commanded during the post-separation
    priming sequence, the shortfall goes unnoticed because sparse early-transfer-orbit telemetry does
    not carry per-thruster catbed temperatures at adequate rate, and hydrazine injected onto a sub-threshold-temperature
    Shell-405 bed pools and decomposes explosively, shattering and washing out catalyst fines that fracture
    the bed retainer and plug the injector/downstream filter — producing degraded, erratic, and off-axis
    thrust that defeats attitude acquisition on that branch and, because the resulting debris and unburned
    propellant can also contaminate the shared manifold, can compromise the redundant branch as well.'
  contamination:
    recognised: false
    confidence: low
    guess: No single identifiable mission — reads as a generic/synthetic pre-mortem for a hydrazine blowdown
      monopropellant RCS on a GEO comsat, though it echoes real anomalies such as AEHF-1 (2010, blocked
      propellant line from debris/contamination, LAE failed, recovered over a year using electric propulsion)
      and pyro-valve/pressurisation failures like Mars Observer (1993) or NOAA/other spacecraft where
      an isolation valve failed to open or a line ruptured
- id: llis621
  source_lesson: llis-621
  source_title: Post Mission Hardware Drop Incident (1998)
  cutoff: '1998-01-01'
  query: 'Pre-mortem request: A low-temperature physics flight experiment has returned from orbit and
    will be disassembled and re-tested in a collaborating university laboratory to recover calibration
    data and refurbish components for possible reflight. Main elements are the cryogenic probe assembly
    containing the sample cell and thermometry, the vacuum-jacketed dewar and its valve tree, the electronics
    and data-acquisition rack, a bench support structure, and a shop-built handling fixture used to move
    the probe assembly between the dewar, the support structure and a storage container. Work proceeds
    in a general-purpose laboratory bay with a concrete floor under a university test plan, with residual
    helium boil-off and purge lines active. Staffing is limited to a couple of graduate researchers plus
    one experiment engineer, and the post-mission analysis must finish before the next grant cycle. Identify
    the failure modes most likely to damage this high-value hardware.'
  failure_mechanism: During transfer of the cryoprobe, the lift fixture's vertical load path, which depended
    on a double lock-nut arrangement, released because one lock nut was missing and the second was nearly
    disengaged, undetected by the unassisted, unsupervised operator, dropping the probe about 18 inches
    onto concrete.
  hindsight_queries:
  - lift fixture failure dropped flight hardware
  - critical lift procedure fail-safe design lessons
  - threaded fastener back-off handling fixture load path
  - pre-operation inspection lifting device flight hardware
  - single point failure hoist fixture drop incident
  difficulty: hard
  blind_guess: 'The most likely loss is a dropped or laterally-swung probe during extraction/transfer,
    caused by the uncertified shop-built handling fixture: with no load test, proof-load analysis, or
    verified center-of-gravity/interface fit, its clamp on the frost-covered, contracting probe neck slips
    (or a single-point bolted/weld joint yields) as the top-heavy, unbalanced assembly comes free of the
    dewar in a hurried two-person lift, letting the cell and thermometry strike the dewar flange or the
    bare concrete floor and shatter the sample cell, sensors, and their irreplaceable as-flown calibration.'
  contamination:
    recognised: false
    confidence: low
    guess: No specific mission identified. The generic profile (flown cryogenic/superfluid-helium physics
      payload, university-partner post-flight teardown) is reminiscent of the Shuttle-era low-temperature
      microgravity physics payloads — e.g. the Lambda Point Experiment (STS-52), the Confined Helium Experiment
      (STS-87), or DYNAMX/CQ-type hardware developed by JPL with Stanford/university co-investigators
      — but nothing in the text pins it to any one of those, and no in-flight or ground anomaly is described.
- id: llis1335
  source_lesson: llis-1335
  source_title: Ensure Test Facilities Can Accommodate "Test-as-You-Fly" (2002)
  cutoff: '2002-01-01'
  query: 'Pre-mortem request: we are qualifying the UHF transceiver for a planetary surface rover that
    will relay science and engineering data through orbiting assets. The unit is a higher-output-power
    successor to a heritage rover radio and must operate in both simplex and duplex modes with a monopole
    antenna. Qualification includes thermal cycling, vibration, conducted and radiated emissions and susceptibility
    testing, and end-to-end link checks against a ground support transceiver inside a shielded metallic
    enclosure at an in-house electromagnetics laboratory. Most link verification uses a hardline connection;
    following a test-as-you-fly principle, an additional radiated over-the-air duplex test with the flight
    antenna installed has been added late in the campaign. Schedule is tight before system-level assembly,
    staffing is shared with other qualification activities, and no external facility rental is budgeted.
    What could go wrong?'
  failure_mechanism: In the over-the-air duplex test, RF energy from the higher-power transmitter reflected
    off the untreated (non-anechoic) metallic walls of the shielded screen room back into the UHF receiver,
    preventing carrier lock and causing a lengthy false-failure investigation.
  hindsight_queries:
  - shielded room RF reflections test failure
  - anechoic absorber required for radiated link testing
  - multipath in screen room transceiver testing
  - test-induced failure RF self-interference receiver lock
  - test facility capability radiated duplex RF testing
  difficulty: easy
  blind_guess: 'The most likely failure is destruction of the flight transceiver during the late-added
    radiated duplex test: conducting it with the higher-power PA driving a monopole inside an untreated,
    highly reflective shielded metal enclosure creates near-field standing waves and reflected power (high
    VSWR) that couple the transmit carrier back into the co-located receive path, overdriving and burning
    out the receiver front-end LNA/limiter (and stressing the PA output stage) — a self-jamming/self-inflicted
    overpower event made more probable by the rushed, thinly staffed setup in which no one runs a link-budget/field-strength
    analysis to insert the attenuation, absorber, or separation that the free-space-equivalent geometry
    assumed.'
  contamination:
    recognised: true
    confidence: low
    guess: A Mars rover UHF proximity-link relay radio qualification — most likely the Electra-Lite UHF
      transceiver for Mars 2020/Perseverance (higher-power successor to the Curiosity/MSL Electra-Lite),
      relaying via MRO/MAVEN/Odyssey/TGO; ExoMars Rosalind Franklin's UHF transceiver is a secondary possibility.
      The specific event sounds like a JPL-style 'lessons learned' write-up of a test anomaly during EMC/qualification
      testing, not a flight failure.
- id: llis1376
  source_lesson: llis-1376
  source_title: Certify Environmental Test Equipment and Facilities, and Qualify Operators (2002)
  cutoff: '2002-01-01'
  query: 'Pre-mortem request: we are about to run an ambient-pressure thermal cycling test on the flight
    avionics module for a planetary surface rover. The module comprises about a dozen plug-in electronics
    boards mated to a flight backplane in a machined chassis, with flight harnesses routed out of the
    chamber through a wall pass-through to external support electronics. The test will be performed in
    a non-vacuum thermal chamber belonging to a subsystem development laboratory rather than the main
    environmental test complex, instrumented with surface-mounted thermocouples and driven by a programmed
    profile: a two-hour soak near room temperature, a ramp down at about 2 deg C per minute, and a two-hour
