  why: Directly addresses facility systems whose as-built modifications/circuits were never recorded in
    updated drawings or communicated to the work team, i.e., equipment left in an undocumented state from
    earlier work; it does not address verifying configuration before operating.
- doc_id: llis-1378
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Core lesson is that workers must personally verify the system state before (and after resuming)
    work rather than assuming others left it safe, which matches the failure to verify configuration before
    proceeding; the energized state was not an unrecorded change left by earlier work.
- doc_id: llis-1427
  grade: 1
