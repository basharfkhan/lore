case: noaa_n_prime
grading: 'Two-question checklist (evals/criteria.yaml): both parts = 2, one = 1, neither = 0.'
graded_by: claude-opus-5 checklist judge; rows marked human were adjudicated by bashar and override the
  judge
reviewed_by: bashar (the 22 disputed rows, see evals/review/adjudication_checklist.md)
notes: The board found the team did not verify the turnover cart's configuration (another program had
  removed 24 bolts without recording it), complacency about a routine move, poor coordination, and ineffective
  oversight. LLIS holds three TOPEX/Poseidon handling incidents from 1992-93 that warn about exactly this.
