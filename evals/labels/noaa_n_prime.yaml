notes: >-
  The board found the team did not verify the turnover cart's configuration (another program had
  removed 24 bolts without recording it), complacency about a routine move, poor coordination,
  and ineffective oversight. LLIS holds three TOPEX/Poseidon handling incidents from 1992-93
  that warn about exactly this.
