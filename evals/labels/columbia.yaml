case: columbia
grading: 'Two-question checklist (evals/criteria.yaml): both parts = 2, one = 1, neither = 0.'
graded_by: claude-opus-5 checklist judge; rows marked human were adjudicated by bashar and override the
  judge
reviewed_by: bashar (the 22 disputed rows, see evals/review/adjudication_checklist.md)
notes: 'LLIS before February 2003 warns that ascent debris (ice) can damage the thermal protection system,
  but holds nothing specific to external tank foam. The strongest precursor is organisational: the Challenger
  report, whose acceptance of recurring O-ring erosion the Columbia board explicitly compared to the treatment
  of foam strikes.'
relevant:
- doc_id: llis-1086
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Directly documents that close calls were habitually handled internally and not passed up the management
    chain, so safety-significant information never reached higher decision makers.
- doc_id: llis-1092
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Specifically about an engineer's problems and concerns not being communicated to the project manager,
    and recommends a process to ensure issues escalate to management.
- doc_id: llis-1266
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: The test team observed exceedances of a load limit and accepted the slightly out-of-limit condition
    as safe rather than stopping, an instance of tolerating an exceedance as normal that led to catastrophic
    failure.
- doc_id: llis-1381
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Explicitly cites the lesson that without a formal method of documenting concerns, concerns 'slip
    through the cracks,' and stresses applying past failure reports—directly about engineers' concerns
    not reaching decision makers.
- doc_id: llis-202
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Documents an inspection team failing to report anomalous low temperature readings to launch officials,
    an instance of safety-relevant concerns/data not reaching decision makers.
- doc_id: llis-272
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Describes a recurring, unexplained anomaly accepted as tolerable and flown with an open failure
    report and workaround — a case of accepting a repeated problem as normal risk.
- doc_id: llis-312
  grade: 1
  about_a: true
  about_b: false
  graded_by: judge
  why: A pyrotechnic rupture produced debris that struck and damaged the orbiter bulkhead insulation and
    possibly a thermal protection tile, i.e., debris impacting vehicle structure/heat shield.
- doc_id: llis-447
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Directly addresses tracking in-spec but anomalous trends so recurring drifts are not dismissed
    as acceptable, a lesson about not normalizing recurring anomalies.
- doc_id: llis-89
  grade: 1
  about_a: true
  about_b: false
  graded_by: judge
  why: Directly addresses ice debris from the ET/SRB/orbiter being dislodged during launch and impacting
    the orbiter's TPS or windows, with a prevention recommendation.
- doc_id: llis-917
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Describes problems being dispositioned within project teams without recourse to outside technical
    expertise, a lesson about engineering concerns/expertise not reaching proper review and decision levels.
- doc_id: report-challenger_rogers_v1
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Debris contact at lift off is only mentioned as a possibility that was ruled out, but the report
    is the canonical account of an eroding-seal anomaly repeatedly accepted as acceptable risk and of
    engineers' launch concerns failing to reach decision makers.
- doc_id: report-hubble_optics
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Explicitly documents that test data indicating the mirror flaw were discounted and that engineers'
    concerns stayed within a closed division and never reached higher management, a direct instance of
    Part B.
- doc_id: report-mco_phase1
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: States the navigation team's trajectory concerns were not communicated effectively to the spacecraft
    operations team or project management, a specific case of engineers' concerns not reaching decision
    makers.
- doc_id: report-mco_phase2
  grade: 1
  about_a: false
  about_b: true
  graded_by: judge
  why: Same communication findings plus recommendations to foster an environment where problems can be
    raised without reprisal, directly addressing concerns failing to reach decision makers.
