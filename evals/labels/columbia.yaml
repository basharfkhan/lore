case: columbia
drafted_by: claude
reviewed_by:
notes: >-
  LLIS before February 2003 warns that ascent debris (ice) can damage the thermal protection
  system, but holds nothing specific to external tank foam. The strongest precursor is
  organisational: the Challenger report, whose acceptance of recurring O-ring erosion the
  Columbia board explicitly compared to the treatment of foam strikes.
relevant:
  - doc_id: report-challenger_rogers_v1
    grade: 2
    why: Recurring anomalies accepted as normal and flight rationale built on past success.
  - doc_id: llis-89
    grade: 2
    why: Ice dislodged during ascent can hit the orbiter's TPS with enough force to cause damage.
  - doc_id: llis-202
    grade: 1
    why: >-
      Challenger ice team did not report discrepancies seen with instruments they did not fully
      understand (found by direct search; pooling missed it).
    found_by: manual
  - doc_id: llis-495
    grade: 1
    why: Safety and quality organisations left out of design decisions.
  - doc_id: llis-447
    grade: 1
    why: Anomalies within specification can later cause problems - the logic of accepting foam strikes as in-family.
    found_by: dense
  - doc_id: llis-733
    grade: 1
    why: Minor glitches get dismissed without formal problem reporting.
    found_by: dense
  - doc_id: llis-1086
    grade: 1
    why: Close calls went unreported because no one treated them as mishaps.
    found_by: dense
  - doc_id: llis-1223
    grade: 1
    why: Simplified models must be refined before being trusted; the board faulted the debris model used outside its validated range.
    found_by: dense
  - doc_id: llis-917
    grade: 1
    why: Project culture did not draw on available technical expertise (MCO); the board found engineering concerns did not reach managers.
    found_by: dense
  - doc_id: llis-1092
    grade: 1
    why: People avoid raising performance problems unless communication barriers are addressed.
    found_by: dense
