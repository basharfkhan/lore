notes: >-
  LLIS before February 2003 warns that ascent debris (ice) can damage the thermal protection
  system, but holds nothing specific to external tank foam. The strongest precursor is
  organisational: the Challenger report, whose acceptance of recurring O-ring erosion the
  Columbia board explicitly compared to the treatment of foam strikes.
relevant:
  - doc_id: report-challenger_rogers_v1
    grade: 2
    why: Recurring anomalies accepted as normal and flight rationale built on past success.
  - doc_id: llis-89
    grade: 2
    why: Ice dislodged during ascent can hit the orbiter's TPS with enough force to cause damage.
  - doc_id: llis-202
    grade: 1
    why: >-
      Challenger ice team did not report discrepancies seen with instruments they did not fully
      understand (found by direct search; pooling missed it).
    found_by: manual
  - doc_id: llis-495
    grade: 1
    why: Safety and quality organisations left out of design decisions.
