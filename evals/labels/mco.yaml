case: mco
drafted_by: claude
reviewed_by:  # set to your name once every judgment below has been checked
notes: >-
  No lesson before September 1999 is about English/metric unit mismatches, so the direct
  precursors are about the process that failed: navigation and spacecraft teams jointly
  modelling small thruster forces, and verifying data that crosses an organisational interface.
relevant:
  - doc_id: llis-424
    grade: 2
    why: >-
      Voyager (1977): translational accelerations from attitude control thrusters complicate
      orbit determination; navigation and spacecraft teams must jointly estimate these effects
      and establish operational interfaces. MCO's small-forces modelling failed at exactly this
      interface.
  - doc_id: llis-569
    grade: 2
    why: >-
      Interface control and verification: communicating design details across mechanical,
      electrical and informational interfaces is a pervasive failure point. MCO's root cause was
      a ground software file that did not meet its interface specification.
  - doc_id: llis-423
    grade: 1
    why: Viking non-gravitational accelerations must be estimated against navigation requirements.
  - doc_id: llis-577
    grade: 1
    why: Data translated between two organisations' software can be silently corrupted; verify it.
  - doc_id: llis-584
    grade: 1
    why: MGS ground/flight software configuration mismatch; verify ground software compatibility.
  - doc_id: llis-585
    grade: 1
    why: Staff continuity from development into operations; the MCO board cited this transition.
  - doc_id: llis-262
    grade: 1
    why: Concurrent real-time operations starve planning; MCO's navigators were shared with MPL.
  - doc_id: llis-608
    grade: 1
    why: State requirements unambiguously across partner organisations.
  - doc_id: llis-723
    grade: 1
    why: Independent V&V of software; the board found ground software was not adequately verified.
  - doc_id: report-lewis
    grade: 1
    why: Lean operations team failed to monitor the spacecraft during a critical period.
  - doc_id: report-soho
    grade: 1
    why: Operations errors under a reduced, overloaded operations team.
