case: genesis
drafted_by: claude
reviewed_by: null
notes: The board's findings were an inverted sensor design that heritage and drawing reviews did not catch,
  and a verification approach that substituted inspection for test. Lessons on trusting heritage designs
  and on test-as-you-fly are the direct precursors. LLIS 1733 (the Genesis lesson itself) was recorded
  with a date before the crash and is corrected in configs/llis_date_overrides.yaml.
