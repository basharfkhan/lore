case: mpl
drafted_by: claude
reviewed_by:
notes: >-
  The probable cause was a spurious touchdown-sensor signal at leg deployment, latched by flight
  software, that shut the engines down at altitude. LLIS held three lessons about transient or
  spurious inputs triggering irreversible actions during deployment events. The Mars Climate
  Orbiter board report and lesson were published before MPL arrived and are legitimately
  available.
relevant:
  - doc_id: llis-409
    grade: 2
    why: >-
      Voyager gyro swap: enable protection logic only when needed and preclude spurious inputs
      triggering unwanted events. The same mechanism that shut down MPL's engines.
  - doc_id: llis-422
    grade: 2
    why: Deployment events produce false sensor readings; disable the dependent logic around them.
  - doc_id: llis-634
    grade: 2
    why: WIRE - transients at power-up triggered an irreversible action; design for transients.
  - doc_id: llis-432
    grade: 1
    why: Keep real-time telemetry during critical events; the MPL board faulted its absence.
  - doc_id: llis-378
    grade: 1
    why: System engineers must own subsystem interactions; subsystem engineers will not predict them.
  - doc_id: llis-411
    grade: 1
    why: Design for testability; abnormal modes are easy to overlook.
  - doc_id: llis-594
    grade: 1
    why: Ground tests should mirror the flight configuration.
  - doc_id: llis-596
    grade: 1
    why: Faster-better-cheaper missions are vulnerable to scope and resource pressure.
  - doc_id: llis-723
    grade: 1
    why: Independent verification and validation of embedded software.
  - doc_id: llis-269
    grade: 1
    why: Magellan star scanner false sightings - sensors can report events that did not happen.
  - doc_id: llis-641
    grade: 1
    why: MCO board (Nov 1999) with recommendations addressed to MPL before its landing.
  - doc_id: report-mco_phase1
    grade: 1
    why: Same, the full MCO Phase I report.
  - doc_id: report-wire
    grade: 1
    why: Full WIRE board report on the start-up transient.
  - doc_id: llis-403
    grade: 2
    why: Viking '75 - stored safing logic fired thrusters on the pad, a phase it was never meant to run in; consider what stored logic does if triggered at the wrong time.
    found_by: dense
  - doc_id: llis-626
    grade: 1
    why: Deep Space 2 (MPL's companion probes) - FMECA and sneak-circuit analysis at system level.
    found_by: dense
  - doc_id: llis-4
    grade: 1
    why: Ground test configuration that differs from flight configuration causes failures.
    found_by: dense
  - doc_id: llis-333
    grade: 1
    why: Delayed diagnostic data cripples anomaly response; relates to no telemetry during EDL.
    found_by: dense
