[project]
name = "lore"
version = "0.1.0"
description = "LORE - Lessons and Outcomes Retrieval Engine: a pre-mortem agent over NASA lessons learned and mishap reports"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pymupdf>=1.24",
    # Needs the Tesseract binary too (Windows: winget install UB-Mannheim.TesseractOCR).
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lore"]
